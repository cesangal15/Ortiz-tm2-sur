<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema Reporte de Obra — Login</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f5a623">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TM2 Sur">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<script src="offline.js"></script>
<style>
  :root { --bg:#0f1117;--surface:#1a1d27;--border:#2e3450;--accent:#f5a623;--accent2:#e8621a;--text:#e8eaf0;--muted:#7a80a0;--error:#e74c3c;--input-bg:#12151f; }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:40px 32px;width:100%;max-width:400px;}
  .logo{text-align:center;margin-bottom:32px;}
  .logo-icon{font-size:48px;margin-bottom:12px;}
  .logo h1{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:var(--text);}
  .logo p{font-size:13px;color:var(--muted);margin-top:4px;}
  .field{margin-bottom:16px;}
  label{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:6px;letter-spacing:0.5px;text-transform:uppercase;}
  input{width:100%;background:var(--input-bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;padding:12px 14px;outline:none;transition:border-color 0.2s;}
  input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(245,166,35,0.1);}
  .btn{width:100%;padding:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:10px;color:#0f1117;font-family:'Syne',sans-serif;font-size:15px;font-weight:700;cursor:pointer;letter-spacing:1px;margin-top:8px;transition:all 0.2s;}
  .btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(245,166,35,0.3);}
  .error{background:rgba(231,76,60,0.1);border:1px solid rgba(231,76,60,0.3);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--error);margin-top:12px;display:none;}
  .error.visible{display:block;}
  .divider{height:1px;background:var(--border);margin:24px 0;}
  .version{text-align:center;font-size:11px;color:var(--muted);}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">🚜</div>
    <h1>Reporte de Obra</h1>
    <p>Ingresa tus credenciales para continuar</p>
  </div>
  <div class="field">
    <label>Usuario</label>
    <input type="text" id="usuario" placeholder="tu usuario" autocomplete="username">
  </div>
  <div class="field">
    <label>Contraseña</label>
    <input type="password" id="clave" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter') login()">
  </div>
  <button class="btn" onclick="login()">INGRESAR →</button>
  <div class="error" id="errorMsg">Usuario o contraseña incorrectos</div>
  <div class="divider"></div>
  <div class="version">Sistema de Reporte v2.0</div>
</div>
<script>
const USUARIOS = {
  'admin':       { clave: 'venganza753', rol: 'admin',       redirige: 'menu.html' },
  'encargado':   { clave: 'enc1-2', rol: 'encargado',  redirige: 'encargado.html' },
  'residente':   { clave: 'Ortiz2026', rol: 'residente',  redirige: 'residente.html' },
  'jefe':        { clave: 'Ortiz2026', rol: 'jefe',       redirige: 'jefe.html' },
  // Capataces y mairy tienen doble deber (reporte de obra + asistencia de personal, D69): aterrizan
  // en seleccion-reporte.html, que arma sus tiles según el usuario. El rol no cambia (sigue siendo
  // 'capataz'/'chequeadora' para que encargado.html y demás guards no se vean afectados).
  // D84: `albert` y `ariel` salieron a UF3 (fuera de este sistema); sus llaves se eliminan y NO se
  // reutilizan. El histórico de BANDEJA/DATA/ASISTENCIA con reporta=albert/ariel se conserva tal cual.
  // Capataces de tierras vigentes: angel, alejo, robinson.
  'angel':       { clave: 'capataz2025',  rol: 'capataz',    redirige: 'seleccion-reporte.html' },
  'alejo':       { clave: 'capataz2025',  rol: 'capataz',    redirige: 'seleccion-reporte.html' },
  'robinson':    { clave: 'capataz2025',  rol: 'capataz',    redirige: 'seleccion-reporte.html' },
  // Drenajes (D70): capataces NOMINALES por área (usuario propio → trazabilidad en `reporta`, igual
  // que los de tierras). El ROL (capataz_odt/capataz_odl) es lo que activa el modo del formulario.
  // Claves placeholder comunes por área; llaves en minúscula (login hace trim+toLowerCase).
  // ODT (transversal): Mauricio, Eduardo, Enrique. ODL (longitudinal): Jairo.
  // Doble deber (D72): igual que los capataces de tierra, ahora también reportan asistencia de su
  // personal ODT/ODL, así que aterrizan en seleccion-reporte.html (reporte de drenajes + asistencia).
  // D84: capataz de drenajes con acceso a AMBOS capítulos → campo OPCIONAL `areas` (['odt'],['odl'] o
  // ['odt','odl']). Sin el campo, el área se deriva del rol como hoy (capataz_odt/capataz_odl) → los
  // capataces de una sola área se comportan EXACTAMENTE igual que hoy (no-regresión). Para darle a un
  // capataz las dos áreas basta con añadirle `areas: ['odt','odl']` a su fila (el reporte-drenajes
  // deriva el área de cada línea del CC del ítem: 06.*→ODT, 07.*→ODL).
  'mauricio':      { clave: 'dren2026',  rol: 'capataz_odt', areas: ['odt','odl'],  redirige: 'seleccion-reporte.html' },
  'eduardo':       { clave: 'dren2026',  rol: 'capataz_odt',  areas: ['odt','odl'],  redirige: 'seleccion-reporte.html' },
  'enrique':       { clave: 'dren2026',  rol: 'capataz_odt',  areas: ['odt','odl'],  redirige: 'seleccion-reporte.html' },
  'jairo':         { clave: 'dren2026',  rol: 'capataz_odl', areas: ['odt','odl'],   redirige: 'seleccion-reporte.html' },
  // Doble deber (D72): revisan su panel de drenajes + el resumen de asistencia de SU área (odt/odl),
  // así que aterrizan en seleccion-reporte.html.
  // D84: la residente ODT salió a UF3 y la residente ODL asume también ODT con un SOLO login
  // `residente_dren` (rol residente_dren → ['odt','odl']). El panel y el resumen le muestran las dos
  // áreas juntas. Los logins de una sola área (`residente_odt`/`residente_odl`) se ELIMINAN (decisión
  // del usuario, jul-2026: un solo login para esa persona); los ROLES de un área se conservan en los
  // guards/helpers por retrocompatibilidad, por si algún día vuelve un residente de una sola área.
  'residente_dren': { clave: 'Ortiz2026', rol: 'residente_dren', redirige: 'seleccion-reporte.html' },
  // Chequeadoras (claves: comparten una contraseña común; usuario se compara en minúsculas).
  // maleja/mairy/luzdary tienen doble deber (reporte de obra + asistencia de su cuadrilla): aterrizan
  // en seleccion-reporte.html. maleja -> cuadrilla ALBERT, luzdary -> cuadrilla ALEJANDRO (se definen
  // en la columna `responsables` de la hoja CUADRILLAS). El rol sigue siendo 'chequeadora'.
  'maleja':   { clave: 'cheq2025', rol: 'chequeadora', redirige: 'seleccion-reporte.html' },
  'mairy':    { clave: 'cheq2025', rol: 'chequeadora', redirige: 'seleccion-reporte.html' },
  'maria':    { clave: 'cheq2025', rol: 'chequeadora', redirige: 'reporte-chequeadora.html' },
  'luzdary':  { clave: 'cheq2025', rol: 'chequeadora', redirige: 'seleccion-reporte.html' },
  // Módulo de Asistencias (D69): jeisson reporta operadores + resumen sin gestión de personal.
  'jeisson':  { clave: 'Oficial2026', rol: 'asistencia_plus', redirige: 'seleccion-reporte.html' },
  // Digitación de volquetas (D83, backlog 2.22): la digitadora pre-llena la BASE de transporte a
  // partir de VOLQUETAS y exporta; no ve el resto del sistema. Clave placeholder (endurecimiento 2.21).
  'digitadora': { clave: 'volquetas2026', rol: 'digitadora', redirige: 'digitadora.html' },
};

function login() {
  const u = document.getElementById('usuario').value.trim().toLowerCase();
  const c = document.getElementById('clave').value;
  const err = document.getElementById('errorMsg');
  if (USUARIOS[u] && USUARIOS[u].clave === c) {
    // D82: la sesión vive en localStorage para sobrevivir pestaña en segundo plano / cierre del
    // navegador en zona muerta (antes sessionStorage, que se pierde al cerrar la pestaña).
    localStorage.setItem('usuario', u);
    localStorage.setItem('rol', USUARIOS[u].rol);
    // D84: campo opcional `areas` (capataz de drenajes con acceso a ambos capítulos). Si el usuario
    // no lo trae, se limpia y las pantallas derivan el área del rol como hoy (no-regresión).
    const areas=USUARIOS[u].areas;
    if(Array.isArray(areas) && areas.length) localStorage.setItem('areas', JSON.stringify(areas));
    else localStorage.removeItem('areas');
    // limpieza de la clave vieja de sessionStorage (versiones anteriores a D82)
    sessionStorage.removeItem('usuario');
    sessionStorage.removeItem('rol');
    err.classList.remove('visible');
    window.location.href = USUARIOS[u].redirige;
  } else {
    err.classList.add('visible');
    document.getElementById('clave').value = '';
  }
}
</script>
</body>
</html>
